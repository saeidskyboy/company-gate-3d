  function textSprite(text, { color = '#ffffff', border = null, bg = 'rgba(16,20,30,0.86)', h = 0.017, bold = 600 } = {}) {

    g.font = font;
    const tw = Math.max(...lines.map(l => g.measureText(l).width));
    c.width = Math.ceil(tw + pad * 2); c.height = Math.ceil(lines.length * fontPx * 1.2 + pad * 1.4);

    g.fillStyle = color; g.textBaseline = 'top';
    lines.forEach((l, i) => g.fillText(l, pad, pad * 0.7 + i * fontPx * 1.2));
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.minFilter = THREE.LinearFilter;

      box(ctx.root, [470, 20, 470], [cx, 3370, 0], M.led, 'cap');
      box(ctx.root, [540, 30, 540], [cx, 3395, 0], ctx.mats.paint, 'cap');
      box(ctx.root, [1200, 6, 1200], [cx, 3, 0], M.concrete, 'found');
      cyl(ctx.root, 45, 30, [cx, 18, 420], M.led, 'uplight');
      ctx.count('S200', 4600, 'pillar');
    });
    const signMat = new THREE.MeshStandardMaterial({ map: logoTex(ctx.opt.accent, true), emissive: 0xffffff, emissiveIntensity: 0.05, metalness: 0.3, roughness: 0.4 });
    signMat.emissiveMap = signMat.map; ctx.mats.logo = signMat; ctx.mats.logoSquare = true;
    box(ctx.root, [400, 400, 6], [-250, 2450, 253], signMat, 'sign');
    box(ctx.root, [140, 240, 40], [6250, 1350, 270], M.dark, 'intercom');
    box(ctx.root, [90, 60, 6], [6250, 1420, 291], M.glass, 'intercom');
    // barcode pattern (left leaf, mirrored for right)
    const R = rng(20261115), bars = []; let x = 95;
    let wide = true;
    while (true) {
      const gap = 45 + Math.round(R() * 50);
      const w = wide ? 80 : 30;
      if (x + gap + w + 45 > 2875) break;
      x += gap; bars.push([x + w / 2, w]); x += w;
      wide = R() < 0.45 ? wide : !wide;
    }
    const shift = (2875 - x) / 2; bars.forEach(b => b[0] += shift);
    swingLeaves(ctx, (pv, s) => {
      const X = x => s * x;
      bar(pv, [X(15), 120, 0], [X(2955), 120, 0], 'B80', 'frame');
      bar(pv, [X(15), 2960, 0], [X(2955), 2960, 0], 'B80', 'frame');
      bar(pv, [X(55), 160, 0], [X(55), 2920, 0], 'B80', 'frame');
      bar(pv, [X(2915), 160, 0], [X(2915), 2920, 0], 'B80', 'frame');
      bars.forEach(([bx, w]) => w === 80 ? bar(pv, [X(bx), 160, 0], [X(bx), 2920, 0], 'B80', 'bar80') : bar(pv, [X(bx), 160, 0], [X(bx), 2920, 0], 'B30', 'bar30', { mat: ctx.mats.accent }));
      bar(pv, [X(95), 1500, -30], [X(2875), 1500, -30], 'B80', 'hidden');
      bar(pv, [X(95), 160, -45], [X(2875), 2920, -45], 'L40', 'hidden', { ls: [1, -1] });
      [450, 2600].forEach(y => { cyl(pv, 28, 150, [0, y, 0], M.galv, 'hinge'); ctx.box(pv, [60, 60, 24], [X(-5), y, 0], M.galv, 'hinge'); });
    });
    [[260, -230], [5740, -230]].forEach(([x, z]) => box(ctx.root, [520, 10, 360], [x, 5, z], M.galv, 'motor'));
    addDim(ctx.dims, [0, 20, 650], [6000, 20, 650], [0, 0, 0], 'Clear opening 6000');
    addDim(ctx.dims, [6650, 0, 350], [6650, 3000, 350], [0, 0, 0], 'Leaf top 3000', '#ffd34d', [550, 0, 0]);
    addDim(ctx.dims, [-500, 3420, 260], [0, 3420, 260], [0, 350, 0], 'Pillar 500×500 · h 3400');
    addDim(ctx.dims, [35, 20, -150], [35, 20, -2960], [0, 0, 0], 'Swing radius 2960 (keep clear)', '#7fe0ff');
    ctx.label([-250, 4500, 0], 'Clad pillar + LED cap'); ctx.label([1500, 2300, 300], '80×30 + 30×30 “barcode”'); ctx.label([5740, 400, -700], 'Underground motor');
    ctx.label([-250, 2950, 500], 'Logo plate'); ctx.label([6250, 1800, 500], 'Intercom');
    road(ctx); fence(ctx, -14000, -500, 0); fence(ctx, 6500, 14000, 0);
  }

  /* ---------- build all ---------- */
  const BUILD = { A: buildA, B: buildB, C: buildC, D: buildD };
  const CTX = {};
  const OFFS = { A: [0, 0, 0], B: [21000, 0, 0], C: [0, 0, 20000], D: [17000, 0, 20000] };
  OPTIONS.forEach(o => {
    const ctx = makeCtx(o); BUILD[o.id](ctx); CTX[o.id] = ctx; scene.add(ctx.root);
    ctx.meshes.forEach(m => m.userData.mat0 = m.material);
    const tag = textSprite(`${o.id} · ${o.kind === 'slide' ? 'Sliding' : 'Swing'} · ${o.budget === 'eco' ? 'Budget' : 'Premium'}`, { color: '#fff', border: o.budget === 'eco' ? '#5fd38a' : '#c08cff', h: 0.022, bold: 800 });
    tag.position.set(o.center[0], 4700, 0); ctx.root.add(tag); ctx.tagSprite = tag;
  });

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(600000, 600000), MSM(0x58654c, { metalness: 0, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  // truck + person (single view only)
  const scaleGrp = new THREE.Group(); scene.add(scaleGrp);
  (function truck() {
    const t = new THREE.Group(); t.position.set(4700, 0, 13000); scaleGrp.add(t);
    const add = (s, p, m) => { const b = new THREE.Mesh(boxGeo(...s), m); b.position.set(...p); b.castShadow = b.receiveShadow = true; t.add(b); return b; };
    add([2500, 2300, 2200], [0, 1650, 0], M.white);
    add([2300, 900, 30], [0, 2200, -1105], M.glass);
    add([2550, 3300, 7400], [0, 2350, 5100], M.truckBlue);
    add([2400, 300, 9600], [0, 650, 3800], M.dark);
    [[-1100, 300], [1100, 300], [-1100, 5000], [1100, 5000], [-1100, 6400], [1100, 6400]].forEach(([x, z]) => {
      const w = new THREE.Mesh(new THREE.CylinderGeometry(500, 500, 300, 24), M.rubber); w.rotation.z = Math.PI / 2; w.position.set(x, 500, z); w.castShadow = true; t.add(w);
    });
    const p = new THREE.Group(); p.position.set(-1300, 0, 1600); scaleGrp.add(p);
    const legs = new THREE.Mesh(new THREE.CapsuleGeometry(150, 600, 4, 10), M.pants); legs.position.y = 450; p.add(legs);
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(190, 420, 4, 12), M.vest); body.position.y = 1180; p.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(110, 16, 12), M.skin); head.position.y = 1620; p.add(head);
    p.children.forEach(c => c.castShadow = true);
    const sp = textSprite('1.75 m', { h: 0.012 }); sp.position.set(0, 1950, 0); p.add(sp);
  })();

  /* ---------- UI: cards, detail, colours ---------- */
  function bom(ctx) {
    const by = {};
    ctx.members.forEach(m => { const b = by[m.sec] || (by[m.sec] = { n: 0, len: 0 }); b.n++; b.len += m.len; });
    let leafKg = 0; ctx.members.forEach(m => { if (ctx.opt.parts[m.part] && ctx.opt.parts[m.part].leaf) leafKg += SEC[m.sec].kg * m.len / 1000; });
    if (ctx.opt.kind === 'swing') leafKg /= 2;
    return { by, leafKg };
  }
  const cards = document.getElementById('cards');
  OPTIONS.forEach(o => {
    const d = document.createElement('div'); d.className = 'card'; d.dataset.opt = o.id;
    d.innerHTML = `<span class="code">${o.id}</span><span class="k">${o.kind === 'slide' ? '⇄ Sliding' : '⟲ Swing (2 leaves)'}</span>
      <div class="t">${o.short}</div><span class="badge ${o.budget}">${o.budget === 'eco' ? '💰 Budget' : '✨ Premium'}</span>`;
    d.onclick = () => selectOpt(o.id, true);
    cards.appendChild(d);
  });
  function renderDetail() {
    const o = OPT[state.opt], ctx = CTX[o.id], { by, leafKg } = bom(ctx);
    let stockKg = 0, buyKg = 0;
    const rows = Object.entries(by).map(([sec, b]) => {
      const S = SEC[sec], kg = S.kg * b.len / 1000; if (S.stock) stockKg += kg; else buyKg += kg;
      const bars = S.stock ? Math.ceil(b.len * 1.1 / 6000) : '–';
      return `<tr><td>${S.stock ? '🟢' : '🛒'} ${S.label}</td><td class="n">${b.n}</td><td class="n">${(b.len / 1000).toFixed(1)} m</td><td class="n">${bars}</td><td class="n">${Math.round(kg)} kg</td></tr>`;
    }).join('');
    const li = a => a.map(x => `<li>${x}</li>`).join('');
    document.getElementById('detail').innerHTML = `
      <h2>${o.id} · ${o.title}</h2>
      <p><i>${o.tagline}</i></p>
      <div class="kpi">
        <div>${o.kind === 'slide' ? 'Leaf weight' : 'Weight per leaf'}<b>≈ ${Math.round(leafKg)} kg</b></div>
        <div>Steel from your stock<b>≈ ${Math.round(stockKg)} kg</b></div>
        <div>Movement<b>${o.kind === 'slide' ? 'Slides left ' + (o.travel / 1000).toFixed(2) + ' m' : '2 × 90° inwards'}</b></div>
        <div>Budget<b>${o.budget === 'eco' ? '💰 Low' : '✨ High'}</b></div>
      </div>
      <h3>How it works</h3><p>${o.how}</p>
      <h3>Structure</h3><ul>${li(o.structure)}</ul>
      <h3>Steel list (whole gate incl. posts)</h3>
      <table class="bom"><tr><th>Section</th><th class="n">pcs</th><th class="n">total</th><th class="n">6 m bars*</th><th class="n">weight</th></tr>${rows}
      <tr class="tot"><td>From your stock</td><td></td><td></td><td></td><td class="n">${Math.round(stockKg)} kg</td></tr>
      ${buyKg ? `<tr class="tot"><td>Steel to buy</td><td></td><td></td><td></td><td class="n">${Math.round(buyKg)} kg</td></tr>` : ''}</table>
      <p class="hint">* incl. ~10 % offcuts. 🟢 = your stock, 🛒 = buy. The exact cut list comes with the contractor pack.</p>
      <h3>To buy</h3><ul>${li(o.buy)}</ul>
      <h3>Space needed</h3><p>${o.space}</p>
      <h3>✅ Pros</h3><ul>${li(o.pros)}</ul>
      <h3>⚠️ Cons</h3><ul>${li(o.cons)}</ul>`;
    document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c.dataset.opt === state.opt));
    renderSwatches();
  }
  function renderSwatches() {
    const o = OPT[state.opt], ctx = CTX[o.id];
    const mk = (id, list, mat, key) => {
      const el = document.getElementById(id); el.innerHTML = '';
      list.forEach(([name, hex]) => {
        const b = document.createElement('button'); b.innerHTML = `<i style="background:${hex}"></i>${name}`;
        b.classList.toggle('on', '#' + mat.color.getHexString() === new THREE.Color(hex).getHexString());
        b.onclick = () => {
          mat.color.set(hex); o[key] = hex;
          if (key === 'accent' && ctx.mats.logo) { ctx.mats.logo.map.dispose(); ctx.mats.logo.map = ctx.mats.logo.emissiveMap = logoTex(hex, !!ctx.mats.logoSquare); ctx.mats.logo.needsUpdate = true; }
          renderSwatches();
        };
        el.appendChild(b);
      });
    };
    mk('paints', PAINTS, ctx.mats.paint, 'paint'); mk('accents', ACCENTS, ctx.mats.accent, 'accent');
  }

  /* ---------- selection / info ---------- */
  const info = document.getElementById('info'); let selected = [];
  function select(optId, part) {
    selected.forEach(m => m.material = m.userData.mat0); selected = [];
    if (!part) { info.style.display = 'none'; return; }
    const ctx = CTX[optId], p = ctx.opt.parts[part]; if (!p) return;
    selected = ctx.meshes.filter(m => m.userData.part === part);
    selected.forEach(m => m.material = M.hl);
    const ms = ctx.members.filter(m => m.part === part);
    const bySec = {}; ms.forEach(m => { const b = bySec[m.sec] || (bySec[m.sec] = { n: 0, len: 0 }); b.n++; b.len += m.len; });
    const qty = Object.entries(bySec).map(([s, b]) => `${b.n} × ${SEC[s].label} = ${(b.len / 1000).toFixed(1)} m`).join('<br>');
    info.innerHTML = `<button class="x" title="close">×</button><h3>${optId} · ${p.name}</h3>
      <table><tr><th>Made of</th><td>${p.made}</td></tr>${qty ? `<tr><th>Quantity</th><td>${qty}</td></tr>` : ''}${p.leaf ? '<tr><th>Moves</th><td>yes, part of the leaf</td></tr>' : ''}</table><p>${p.note}</p>`;
    info.style.display = 'block';
    info.querySelector('.x').onclick = () => select(null);
  }

  /* ---------- layout, views, toggles ---------- */
  let fly = null;
  function presets() {
    if (state.all) return { iso: { p: [11500, 21000, 45000], t: [11000, 0, 9500] }, front: { p: [11000, 9000, 52000], t: [11000, 1500, 9500] }, inside: { p: [11000, 20000, -26000], t: [11000, 0, 9500] }, top: { p: [11000, 62000, 9510], t: [11000, 0, 9500] }, detail: { p: [11500, 21000, 45000], t: [11000, 0, 9500] } };
    const o = OPT[state.opt], [cx, cy] = o.center, s = o.span;
    return {
      iso: { p: [cx + 0.62 * s, 0.26 * s, 0.78 * s], t: [cx, cy, 0] },
      front: { p: [cx, cy + 0.08 * s, 0.9 * s], t: [cx, cy, 0] },
      inside: { p: [cx - 0.4 * s, 0.32 * s, -0.85 * s], t: [cx, cy, 0] },
      top: { p: [cx, 1.5 * s, 10], t: [cx, 0, 0] },
      detail: o.detail
    };
  }
  function flyTo(name) {
    const pr = presets()[name]; if (!pr) return;
    fly = { t0: performance.now(), p0: camera.position.clone(), t0v: controls.target.clone(), p1: V(...pr.p), t1: V(...pr.t) };
  }
  function layout() {
    OPTIONS.forEach(o => {
      const ctx = CTX[o.id], show = state.all || o.id === state.opt;
      ctx.root.visible = show;
      ctx.root.position.set(...(state.all ? OFFS[o.id] : [0, 0, 0]));
      ctx.env.visible = state.env && !state.all;
      ctx.dims.visible = state.dims && !state.all;
      ctx.labels.visible = state.labels;
      ctx.tagSprite.visible = state.all;
    });
    scaleGrp.visible = state.truck && !state.all;
    if (state.all) setShadowBox(11000, 10000, 26000); else setShadowBox(OPT[state.opt].center[0], 1500, 13000);
    document.querySelectorAll('[data-toggle]').forEach(b => b.classList.toggle('on', !!state[b.dataset.toggle]));
  }
  function selectOpt(id, fly2) {
    state.opt = id; select(null);
    if (state.all && fly2) { state.all = false; }
    layout(); renderDetail(); if (fly2) flyTo('iso');
    history.replaceState(null, '', '#opt=' + id + (state.all ? '&all=1' : ''));
  }
  function applyNight() {
    const n = state.night;
    scene.background.copy(n ? NIGHT : DAY); scene.fog.color.copy(n ? NIGHT : DAY);
    hemi.intensity = n ? 0.12 : 0.75; sun.intensity = n ? 0.05 : 0.9; fill.intensity = n ? 0.06 : 0.25;
    M.led.emissiveIntensity = n ? 3 : 0.5;
    Object.values(CTX).forEach(c => { if (c.mats.logo) c.mats.logo.emissiveIntensity = n ? 0.9 : 0.05; });
  }
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => flyTo(b.dataset.view));
  document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
    const k = b.dataset.toggle; state[k] = !state[k];
    if (k === 'spin') controls.autoRotate = state.spin;
    if (k === 'night') applyNight();
    layout(); if (k === 'all') flyTo('iso');
  });
  const play = document.getElementById('play'), openR = document.getElementById('openR');
  play.onclick = () => { state.target = state.target > 0.5 ? 0 : 1; };
  openR.oninput = () => { state.target = state.open = openR.value / 100; };

  /* ---------- picking ---------- */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
  renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const pick = []; OPTIONS.forEach(o => { if (CTX[o.id].root.visible) pick.push(...CTX[o.id].meshes); });
    const hit = ray.intersectObjects(pick, false)[0];
    if (!hit) return select(null);
    const { opt, part } = hit.object.userData;
    if (state.all && opt !== state.opt) { state.opt = opt; renderDetail(); }
    select(opt, part);
  });

  /* ---------- loop ---------- */
  function updateSprites() {
    const h = Math.max(150, view.clientHeight), small = Math.min(view.clientWidth, h) < 600;
    const s = Math.min(2.8, 950 / h) * (small ? 0.72 : 1);
    SPRITES.forEach(sp => sp.scale.copy(sp.userData.baseScale).multiplyScalar(s));
  }
  function resize() {
    const w = view.clientWidth, h = view.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h); camera.aspect = w / h;
    camera.fov = camera.aspect < 0.9 ? 50 : 35; camera.updateProjectionMatrix(); updateSprites();
  }
  new ResizeObserver(resize).observe(view); resize();
  const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  let last = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.1, (now - (last || now)) / 1000); last = now;
    if (Math.abs(state.target - state.open) > 1e-4) {
      const sp = 0.22 * dt; state.open += Math.max(-sp, Math.min(sp, state.target - state.open));
      openR.value = Math.round(state.open * 100);
    }
    play.textContent = state.target > 0.5 ? '■ Close' : '▶ Open';
    OPTIONS.forEach(o => CTX[o.id].movers.forEach(f => f(state.open)));
    if (fly) {
      const k = Math.min(1, (now - fly.t0) / 800), e = ease(k);
      camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0v, fly.t1, e);
      if (k >= 1) fly = null;
    }
    controls.update();
    renderer.render(scene, camera);
  }

  // deep link: #opt=B&all=1&open=1&view=front&night=1&full=1
  const hp = new URLSearchParams(location.hash.slice(1));
  if (hp.get('opt') && OPT[hp.get('opt')]) state.opt = hp.get('opt');
  ['all', 'dims', 'labels', 'env', 'truck', 'night', 'spin'].forEach(k => { if (hp.has(k)) state[k] = hp.get(k) === '1'; });
  if (hp.get('open')) state.open = state.target = Math.max(0, Math.min(1, +hp.get('open')));
  if (hp.get('full') === '1') { document.body.classList.add('full'); fsBtn.textContent = '✕'; resize(); }
  controls.autoRotate = state.spin; openR.value = Math.round(state.open * 100);
  layout(); renderDetail(); applyNight();
  const pr = presets()[hp.get('view') || 'iso'] || presets().iso;
  camera.position.set(...pr.p); controls.target.set(...pr.t);
  requestAnimationFrame(loop);
  document.getElementById('loading').style.display = 'none';
  window.__gate = { scene, camera, controls, state, CTX, flyTo, selectOpt, select, renderer };
}
</script>
