      seg(ctx, leaf, [c, y0], [c - H / m, y0 + H], 'B30', 'lattice', { rect, min: 40 });
    }
    const yc = y0 + m * 5 * p / 2, hh = m * p / 2;

  /* ================= swing helpers ================= */
  function swingLeaves(ctx, fill) {
    const pivots = [];
    [[35, 1], [5965, -1]].forEach(([px, s]) => {
      const pv = new THREE.Group(); pv.position.x = px; ctx.root.add(pv); pivots.push(pv);
      const X = x => s * x;
      fill(pv, s, X);

      if (s < 0) ctx.cyl(pv, 9, 1000, [X(2900), 400, -45], M.galv, 'drop');
      else ctx.box(pv, [140, 200, 60], [X(2880), 1100, -50], M.dark, 'lock');
    });
    ctx.movers.push(t => { pivots[0].rotation.y = t * Math.PI / 2; pivots[1].rotation.y = -t * Math.PI / 2; });
    swingZone(ctx, 35, 2960, false); swingZone(ctx, 5965, 2960, true);
    ctx.box(ctx.root, [120, 8, 120], [3000, 4, -60], M.galv, 'drop');
    addDim(ctx.dims, [0, 20, 500], [6000, 20, 500], [0, 0, 0], 'Clear opening 6000');
    addDim(ctx.dims, [6650, 0, 300], [6650, 3000, 300], [0, 0, 0], 'Height 3000', '#ffd34d', [500, 0, 0]);
    addDim(ctx.dims, [50, 3000, 0], [2990, 3000, 0], [0, 450, 0], 'Leaf 2940');
    addDim(ctx.dims, [3010, 3000, 0], [5950, 3000, 0], [0, 450, 0], 'Leaf 2940');
    addDim(ctx.dims, [35, 20, -150], [35, 20, -2960], [0, 0, 0], 'Swing radius 2960 (keep clear)', '#7fe0ff');
    ctx.label([300, 400, -400], 'Heavy hinges'); ctx.label([3000, 600, -400], 'Drop bolt + stop');
    road(ctx); fence(ctx, -14000, -420, 0); fence(ctx, 6420, 14000, 0);
    return pivots;
  }
  function swingFrame(ctx, pv, X, topRail = true) {
    ctx.bar(pv, [X(15), 120, 0], [X(2955), 120, 0], 'B80', 'frame');

      ctx.bar(pv, [X(15), 2960, 0], [X(2955), 2960, 0], 'B80', 'frame');

  /* ================= D: swing budget – arched pickets ================= */
  function buildD(ctx) {
    latticePylon(ctx, -150, 'pylon', 'zig'); latticePylon(ctx, 6150, 'pylon', 'zig');
    const top = lx => 2700 + 300 * Math.sin(Math.PI * (35 + lx) / 6000);
    swingLeaves(ctx, (pv, s, X) => {
      const { bar } = ctx;
      swingFrame(ctx, pv, X, false);
      [55, 2915].forEach(x => bar(pv, [X(x), 160, 0], [X(x), top(x) - 135, 0], 'B80', 'frame'));
      [450, 1950, 2300].forEach(y => bar(pv, [X(95), y, 0], [X(2875), y, 0], 'B80', 'frame', { turn: true }));
      const a = 95, b = 2875, n = Math.round((b - a) / 121), p = (b - a) / n, xs = [];
      for (let i = 0; i < n; i++) { const x = a + p * (i + 0.5), y = top(x); xs.push(x); bar(pv, [X(x), 160, 0], [X(x), y - 60, 0], 'B30', 'pickets'); tip(ctx, pv, X(x), y, 'pickets'); }
      [a - 20, ...xs, b + 20].forEach((x, i, arr) => { if (i) { const xm = (arr[i - 1] + x) / 2; bar(pv, [X(xm), 160, 0], [X(xm), 435, 0], 'B30', 'dog'); } });
      const pts = []; for (let i = 0; i <= 10; i++) { const x = a - 40 + (b - a + 80) * i / 10; pts.push([x, top(x) - 150]); }
      poly(ctx, pv, pts, 'B30', 'arch', { s });
      const nd = 10, w = (b - a) / nd;
      for (let i = 0; i < nd; i++) diamond(ctx, pv, a + w * (i + 0.5), 2125, w / 2, 160, 'band', { s, z: 30, mat: ctx.mats.accent });
      bar(pv, [X(95), 160, -35], [X(2875), 2285, -35], 'L40', 'strut', { ls: [s, -1] });
    });
    ctx.label([-150, 3800, 0], 'Lattice pylon\n4×L40 + 30×30'); ctx.label([3000, 3350, 200], 'Arched picket tops');
    ctx.label([1500, 2125, 400], 'Accent diamond band'); ctx.label([4500, 300, 400], 'Dog bars'); ctx.label([1500, 1100, -400], 'L40 anti-sag strut');
  }

  /* ================= E: swing modern – skyline ================= */
  function twinPylon(ctx, side) {
    const sx = side, ci = side > 0 ? -60 : 6060, co = ci - sx * 270;
    pinwheel(ctx, ctx.root, ci, 0, 3150, 'pylon'); pinwheel(ctx, ctx.root, co, 0, 3150, 'pylon');
    for (let y = 200; y <= 3000; y += 350) [-40, 40].forEach(z => ctx.bar(ctx.root, [co + sx * 55, y, z], [ci - sx * 55, y, z], 'B30', 'pylon'));
    ctx.box(ctx.root, [1000, 6, 800], [(ci + co) / 2, 3, 0], M.concrete, 'found');
  }
  function buildE(ctx) {
    twinPylon(ctx, 1); twinPylon(ctx, -1);
    const h = g => Math.max(2900 - 1.3 * Math.abs(g - 3000), 2250 - 1.2 * Math.abs(g - 1100), 2250 - 1.2 * Math.abs(g - 4900), 600);
    const a = 95, b = 2875, nb = Math.round((b - a) / 110), pb = (b - a) / nb, bx = [];
    for (let i = 0; i < nb; i++) bx.push(a + pb * (i + 0.5));
    const snap = lx => bx.reduce((m, x) => Math.abs(x - lx) < Math.abs(m - lx) ? x : m, bx[0]);
    const rows = [];
    for (let y = 330; y <= 2730; y += 160) {
      let run = null;
      for (let lx = 15; lx <= 2955; lx += 5) {
        const on = h(35 + lx) >= y + 40;
        if (on && run === null) run = lx;
        if ((!on || lx + 5 > 2955) && run !== null) {
          const e = on ? 2955 : lx - 5, x0 = run <= 20 ? 15 : snap(run), x1 = e >= 2950 ? 2955 : snap(e);
          if (x1 - x0 > 150) rows.push([y, x0, x1]);
          run = null;
        }
      }
    }
    swingLeaves(ctx, (pv, s, X) => {
      swingFrame(ctx, pv, X);
      bx.forEach(x => ctx.bar(pv, [X(x), 160, 0], [X(x), 2920, 0], 'B30', 'bars'));
      rows.forEach(([y, x0, x1]) => ctx.bar(pv, [X(x0), y, 30], [X(x1), y, 30], 'B80', 'sky', { mat: ctx.mats.accent }));
      ctx.bar(pv, [X(95), 160, -35], [X(2875), 2920, -35], 'L40', 'strut', { ls: [s, -1] });
    });
    ctx.label([-195, 3700, 0], 'Twin pinwheel pylon\n2 × (4 × 80×30)'); ctx.label([3000, 3250, 300], 'Skyline: 80×30 accent slats');
    ctx.label([4800, 1000, 300], '30×30 background bars'); ctx.label([1500, 1100, -400], 'L40 anti-sag strut');
  }

  /* ================= F: swing decorative – sunrise ================= */
  function buildF(ctx) {
    latticePylon(ctx, -150, 'pylon', 'x'); latticePylon(ctx, 6150, 'pylon', 'x');
    const C = [2965, 160], rect = [95, 160, 2875, 2920], pol = (r, d) => [C[0] + r * Math.cos(d * Math.PI / 180), C[1] + r * Math.sin(d * Math.PI / 180)];

  }

  /* ---------- picking ---------- */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
  renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const pick = []; OPTIONS.forEach(o => { if (CTX[o.id].root.visible) pick.push(...CTX[o.id].meshes); });
    const hit = ray.intersectObjects(pick, false)[0];
    if (!hit) return select(null);
    const { opt, part } = hit.object.userData;
    if (state.all && opt !== state.opt) { state.opt = opt; renderDetail(); }
    select(opt, part);
  });

  /* ---------- loop ---------- */
  function updateSprites() {
    const h = Math.max(150, view.clientHeight), small = Math.min(view.clientWidth, h) < 600;
    const s = Math.min(2.8, 950 / h) * (small ? 0.72 : 1);
    SPRITES.forEach(sp => sp.scale.copy(sp.userData.baseScale).multiplyScalar(s));
  }
  function resize() {
    const w = view.clientWidth, h = view.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h); camera.aspect = w / h;
    camera.fov = camera.aspect < 0.9 ? 50 : 35; camera.updateProjectionMatrix(); updateSprites();
  }
  new ResizeObserver(resize).observe(view); resize();
  const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  let last = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.1, (now - (last || now)) / 1000); last = now;
    if (Math.abs(state.target - state.open) > 1e-4) {
      const sp = 0.22 * dt; state.open += Math.max(-sp, Math.min(sp, state.target - state.open));
      openR.value = Math.round(state.open * 100);
    }
    play.textContent = state.target > 0.5 ? '■ Close' : '▶ Open';
    OPTIONS.forEach(o => CTX[o.id].movers.forEach(f => f(state.open)));
    if (fly) {
      const k = Math.min(1, (now - fly.t0) / 800), e = ease(k);
      camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0v, fly.t1, e);
      if (k >= 1) fly = null;
    }
    controls.update();
    renderer.render(scene, camera);
  }

  // deep link: #opt=B&all=1&open=1&view=front&night=1&full=1
  const hp = new URLSearchParams(location.hash.slice(1));
  if (hp.get('opt') && OPT[hp.get('opt')]) state.opt = hp.get('opt');
  ['all', 'dims', 'labels', 'env', 'truck', 'night', 'spin'].forEach(k => { if (hp.has(k)) state[k] = hp.get(k) === '1'; });
  if (hp.get('open')) state.open = state.target = Math.max(0, Math.min(1, +hp.get('open')));
  if (hp.get('full') === '1') { document.body.classList.add('full'); fsBtn.textContent = '✕'; resize(); }
  controls.autoRotate = state.spin; openR.value = Math.round(state.open * 100);
  layout(); renderDetail(); applyNight();
  const pr = presets()[hp.get('view') || 'iso'] || presets().iso;
  camera.position.set(...pr.p); controls.target.set(...pr.t);
  requestAnimationFrame(loop);
  document.getElementById('loading').style.display = 'none';
  window.__gate = { scene, camera, controls, state, CTX, flyTo, selectOpt, select, renderer };
}
</script>
